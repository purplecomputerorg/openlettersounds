[project]
name = "nemophones"
version = "0.1.0"
description = "Open phonics sounds: one clean clip per letter sound, generated and checked against reference recordings"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "onnxruntime", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nemophones"]

[tool.setuptools.package-data]
nemophones = ["page.html"]
