[project]
name = "openlettersounds"
version = "0.1.0"
description = "Open letter sounds: one clean clip per phonics letter sound, generated and checked against reference recordings. By Purple Computer."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "onnxruntime", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openlettersounds"]

[tool.setuptools.package-data]
openlettersounds = ["page.html"]
